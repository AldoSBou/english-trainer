<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Trainer</title>
<meta name="description" content="Tu aula de inglés: sesión diaria, unidades del curso con vocabulario, gramática, listening, speaking, reading y writing, y herramientas de práctica con voz.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;0,800;1,600&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E7C6B">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>

<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Abrir menú de unidades" aria-expanded="false">☰</button>
  <a class="brand" href="#/">
    <span class="brand-mark">Et</span>
    <span><strong>English Trainer</strong><small>Tu aula de inglés</small></span>
  </a>
  <nav class="mainnav" id="mainNav" aria-label="Principal"></nav>
  <button class="voice-btn" id="voiceBtn" aria-label="Voz y velocidad" aria-expanded="false" title="Elegir voz"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
  <div class="voice-panel" id="voicePanel" role="dialog" aria-label="Voz del profesor"></div>
  <a class="xpbar" href="#/perfil" title="Tu progreso">
    <span class="coin">XP</span>
    <div><b id="xp">0</b> <span class="small muted">· nivel <b id="lvl">1</b></span><div class="track"><i id="xpfill"></i></div></div>
    <span class="streak-pill" id="streakPill" title="Días seguidos practicando"></span>
  </a>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Unidades">
    <div class="side-head">
      <span class="eyebrow">Tu aula</span>
      <button class="close-side" id="closeSide" aria-label="Cerrar menú">✕</button>
    </div>
    <nav id="toolNav" class="tool-nav" aria-label="Secciones"></nav>
    <div class="side-head" style="margin-top:14px"><span class="eyebrow" style="color:var(--muted)">Ciclos y unidades</span></div>
    <nav id="unitNav" class="unit-nav"></nav>
    <div class="side-foot small muted">El progreso se guarda en este navegador.</div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main id="main" class="content">
    <div id="view"></div>
  </main>
</div>

<nav class="appnav" id="appNav" aria-label="Navegación"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Datos: courses/registry.js define los ciclos; una unidad por archivo en courses/<ciclo>/<unidad>.js -->
<script src="courses/registry.js"></script>
